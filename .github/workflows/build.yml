
name: Build Aquarium APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: unzip AkvaryumCanliDuvarKagidi.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/AkvaryumCanliDuvarKagidi/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'android {\n',
              '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          ''',
              1
          )
          s = s.replace(
              '\n}',
              '''
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          ''',
              1
          )
          p.write_text(s)
          print(s)
          PY

      - name: Build debug APK
        run: |
          gradle -p extracted/AkvaryumCanliDuvarKagidi assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akvaryum-APK
          path: extracted/AkvaryumCanliDuvarKagidi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
