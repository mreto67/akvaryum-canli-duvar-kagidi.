
name: Build Aquarium APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: unzip AkvaryumCanliDuvarKagidi.zip -d extracted

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted/AkvaryumCanliDuvarKagidi")
          p = root / "app" / "build.gradle.kts"
          s = p.read_text()

          s = s.replace('kotlinOptions {', 'compileOptions {')
          s = s.replace('jvmTarget = "17"', 'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17')

          if 'targetCompatibility = JavaVersion.VERSION_17' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  1
              )

          p.write_text(s)
          print(s)
          PY

      - name: Build debug APK
        run: gradle -p extracted/AkvaryumCanliDuvarKagidi assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akvaryum-APK
          path: extracted/AkvaryumCanliDuvarKagidi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
