
name: Build Aquarium APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          unzip AkvaryumCanliDuvarKagidi.zip -d extracted
          find extracted -maxdepth 4 -type f | head -100

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          gradle -p "$(dirname "$PROJECT_DIR")" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akvaryum-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
